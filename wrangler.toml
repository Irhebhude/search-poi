name = "search-poi-engine"
compatibility_date = "2026-04-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "CACHE"
id = "61083725182743da80514caf59a03481"
preview_id = "63df4961030744308bb5a05639e2f6df"

# Public API keys for the SEARCH-POI v1 public API (/api/generate-key, /api/revoke-key).
# Real IDs created in Cloudflare Dashboard
[[kv_namespaces]]
binding = "API_KEYS"
id = "0a3e003bf24c4df6b985a0b247a14aec"
preview_id = "252b6b5b450f474a9d514791ee72f03b"

[[d1_databases]]
binding = "DB"
database_name = "search-poi-db"
database_id = "e5ebcc35-2261-4a93-8949-879e6a07612c"

[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# R2 (file storage) — KEPT FOR FUTURE USE.
#
# Deploys fail with "R2 bucket 'search-poi-files' not found" while the bucket
# does not exist, so the binding stays commented until it is created:
#
# npx wrangler r2 bucket create search-poi-files
#
# Then uncomment the three lines below and redeploy. Every `env.BUCKET` use in
# the Worker is guarded, so the app deploys and runs fine without it.
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "search-poi-files"
# ---------------------------------------------------------------------------

# Runtime variables live in Cloudflare Pages → Settings → Environment variables
# (Production): VITE_API_BASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# AUTH_SECRET, ADMIN_EMAILS, GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY,
# AYRSHARE_API_KEY, NASA_API_KEY. Secrets are never committed here.
